# gitleaks configuration - allowlist for PUBLIC, NON-SECRET high-entropy strings.
# gitleaks flags any high-entropy string as "generic-api-key" /
# "square-access-token": blockchain addresses, transaction hashes, EIP-712
# typehashes, ECDSA signature r/s components, encoding alphabets and dependency
# lockfile integrity hashes are all PUBLIC data, never secrets.
#
# THE TRAP THAT COSTS AN EXTRA RESCAN ROUND:
#   allowlist "regexes" are matched against the DETECTED SECRET STRING, not
#   against the variable name and not against the surrounding source line.
#   An entry like '''KEY_ALPHABET''' therefore does NOTHING - you must allowlist
#   the alphabet literal itself. Always open the Probe finding, read the matched
#   string, and write a regex for THAT literal.
#
# SEMANTIC JUDGEMENT IS YOURS:
#   scanners cannot tell a public on-chain value (address, tx hash, signature
#   r/s) from a private key - only you can. Read every matched string before
#   allowlisting it. Real secrets must be REMOVED (and rotated), never masked.

[extend]
useDefault = true

[allowlist]
description = "Public, non-secret constants (chain data, lockfile hashes)"
regexes = []
paths = [
  # Dependency lockfiles: package integrity hashes, not credentials.
  '''uv\.lock''',
]

# ---------------------------------------------------------------------------
# CANDIDATES - commented on purpose. Uncomment ONLY after reading the actual
# matched string in the Probe finding and confirming it is public.
# ---------------------------------------------------------------------------
# DANGER: 0x + 64 hex is ALSO exactly the shape of an EVM / secp256k1
#   PRIVATE KEY. The pre-publish scan does NOT detect a bare 64-hex private
#   key, so this entry can hide real key material. Uncomment only after
#   reading every matched string and confirming none of them is a key.
#   Legitimate 32-byte values: tx hashes, EIP-712 typehashes,
#   DOMAIN_SEPARATOR, nonces, ECDSA signature r/s - all public on-chain.
#   '''0x[0-9a-fA-F]{64}\b''',
#
# base58 addresses (Solana / Tron / NEAR token + account addresses), public:
#   e.g. a Solana mint or a Tron account address.
#   '''\b[1-9A-HJ-NP-Za-km-z]{32,44}\b''',
#
# Encoding alphabet literals (base62 / base58 character sets). Remember the
# trap above: allowlist the LITERAL, not the constant name.
#   '''[A-Za-z]*ABCDEFGHIJKLMNOPQRSTUVWXYZ[A-Za-z0-9]*''',
#   '''123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz''',
#
# Public signer prefixes (DER / ed25519) - public key framing, not keys:
#   '''[A-Z_]*_DER_PREFIX''',
#   '''ED25519_PREFIX''',
#
# Idempotency keys / demo fixtures - non-secret dummy strings:
#   '''idem-key-[a-z0-9-]+''',
#
# Whole-path exemptions (use sparingly - a path exemption hides EVERYTHING
# in that file, including a real secret added later):
#   '''test/fixtures/.*''',
#   '''uv\.lock''',            # only if this repo ships a uv lockfile
#   '''pnpm-lock\.yaml''',     # only if this repo ships a pnpm lockfile
#
# Tip: don't use AKIA-prefixed dummy strings in tests (they trip scanners);
#      use something like test-akid instead.
#
# Iterate and verify - never guess:
#   1. edit this file  2. push to GitLab  3. wait for the Probe rescan
#   4. read the remaining ERROR findings  5. repeat until Critical = 0

# ===========================================================================
# CUSTOM RULES — internal-information disclosure (not "secrets")
#
# WHY THESE EXIST
#   gitleaks' default rules look for credentials. They do NOT flag the class of
#   problem that actually bit this repository: internal system names, an
#   internal browser-extension ID, an internal account name, and a real customer
#   name, all copied verbatim from the internal repo this sample derives from.
#   None of those is a secret, so every default rule stayed green.
#
# RELATIONSHIP TO CI
#   The authoritative gate is .github/workflows/ci.yml → provenance job, which
#   scans EVERY blob in EVERY ref (gitleaks here is typically run against the
#   working tree / a commit range). These rules exist so a local `gitleaks
#   detect` and any pre-commit hook catch the same thing early. Term lists are
#   duplicated between here and .github/internal-terms.txt ON PURPOSE — gitleaks
#   cannot read that file's format. Authoritative list is internal-terms.txt;
#   keep the two in sync when editing either.
#
# SELF-REFERENCE TRAP — READ BEFORE EDITING
#   These regexes must not literally spell what they match, or gitleaks and the
#   provenance job will both flag this very file. One character of each term is
#   wrapped in a character class (e.g. a pattern of the form Xxxx[y]yyy matches
#   Xxxxyyyy without spelling it). Same rule applies to descriptions/comments.
#   `keywords` is deliberately omitted for the same reason: gitleaks keywords
#   must be literal strings, which would defeat the whole convention.
# ===========================================================================

[[rules]]
id = "internal-enterprise-identity-plumbing"
description = "Names an internal enterprise identity / device-compliance component. Public samples must not reference internal auth or compliance machinery, and must never document how to make it work under a non-standard configuration."
regex = '''(?i)([M]idway|\bA[E]A\b|\bAC[M]E\b|\bacme[d]\b|Yubi[K]ey|idpris[m]|amazon_enterprise_[a]ccess|NativeMessaging[H]osts)'''
tags = ["internal", "identity", "do-not-publish"]

[[rules]]
id = "internal-browser-extension-id"
description = "Chrome extension ID of an internal enterprise-access extension. A stable identifier that ties a public repo to internal browser tooling."
regex = '''(?i)bkbighdlgofgdhcjnhocalbkiehhpde[i]'''
tags = ["internal", "identifier", "do-not-publish"]

[[rules]]
id = "internal-infrastructure-identifier"
description = "Internal account / org / group name. Leaks deployment topology. Start URLs must come from QUICK_WEB_ACCOUNT / QUICK_WEB_BASE, never a hardcoded real account."
regex = '''(?i)(amazon[b]i|gitlab\.aws\.[d]ev|aws-gcr-[w]eb3)'''
tags = ["internal", "infrastructure", "do-not-publish"]

[[rules]]
id = "customer-identifying-name"
description = "Real customer or engagement name, including real Space names. Highest business impact of anything in this file. Use a placeholder such as <Customer> plus a generic suffix instead."
regex = '''(?i)(Rock[b]und|Client [3]60|Field [T]ools|Account [P]lanning|Transformation-in-[F]inance)'''
tags = ["internal", "customer", "do-not-publish"]
